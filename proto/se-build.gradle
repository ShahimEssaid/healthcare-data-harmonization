//apply plugin: 'java-library'
//apply plugin: 'com.google.protobuf'
//apply plugin: 'idea'
//apply plugin:

plugins {
    id 'java-library'
    id 'com.google.protobuf'
    id 'idea'
    id 'com.vanniktech.maven.publish' version '0.34.0'
}

// SE: change group to allow publishing to OSSRH
group "${groupIdPrefix}.com.google.cloud.verticals.foundations.dataharmonization"

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.18.1'
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    apply plugin: 'idea'
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

sourceSets {
    main {
        java {

            srcDirs += "build/generated/source/proto/main/java"
        }
    }
}


dependencies {
    api 'com.google.protobuf:protobuf-java:3.18.1'
    api 'com.google.protobuf:protobuf-java-util:3.18.1'
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "javax.annotation:javax.annotation-api:1.3.2"
}

repositories {
    mavenCentral()
    maven {
        name = "CentralSnapshots"
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
    }
    maven {
        name = "GitHubSEPackages"
        url = uri("https://maven.pkg.github.com/ShahimEssaid/m2")
    }
}

pluginManager.withPlugin("java") {
    java {
        withSourcesJar()
//            withJavadocJar()
    }
}

tasks.named("sourcesJar").configure {
    dependsOn("generateProto")
}

import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar


mavenPublishing {
    publishToMavenCentral()
    configure(new JavaLibrary(new JavadocJar.None(), true))
}

publishing {
    repositories {
        maven {
            name = "GitHubSEPackages"
            url = uri("https://maven.pkg.github.com/ShahimEssaid/m2")
            credentials(PasswordCredentials)
        }
    }
}
