dependencies {
    // TODO(): Set up versioning
    api group: "${groupIdPrefix}.com.google.cloud.verticals.foundations.dataharmonization", name: "runtime"
    api project(":common")

    implementation group: "com.google.guava", name: "guava", version: "31.0.1-jre"

    if (gradle.ext.has("annotationProcessorExists") && gradle.ext.annotationProcessorExists){
        annotationProcessor ("${groupIdPrefix}.com.google.cloud.verticals.foundations.dataharmonization:annotation_processor")
    }

    testImplementation 'junit:junit:4.13'
    testImplementation 'com.google.guava:guava-testlib:25.1-jre'
}



repositories {
    mavenCentral()
    maven {
        name = "CentralSnapshots"
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
    }
    maven {
        name = "GitHubSEPackages"
        url = uri("https://maven.pkg.github.com/ShahimEssaid/m2")
    }
}


import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar


mavenPublishing {
    publishToMavenCentral()
    configure(new JavaLibrary(new JavadocJar.None(), true))
}

publishing {
    repositories {
        maven {
            name = "GitHubSEPackages"
            url = uri("https://maven.pkg.github.com/ShahimEssaid/m2")
            credentials(PasswordCredentials)
        }
    }

}


